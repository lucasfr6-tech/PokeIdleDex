name: Check update log
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-changelog.cjs HEAD^ HEAD
